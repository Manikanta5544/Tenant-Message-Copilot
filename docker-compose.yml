# Local Postgres 16 for development and tests: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: copilot }
    ports: ["5432:5432"]
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes: { pgdata: {} }
